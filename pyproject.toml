[project]
name = "agentic-rag-orchestration"
version = "0.1.0"
description = "Self-correcting agentic RAG orchestration (Gatekeeper/Research/Writer/Verifier on LangGraph + PydanticAI) over enterprise-rag-platform via MCP"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "gradio>=6.29.0",
    "httpx>=0.28.1",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "mcp>=2.2.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[mcp,openai]>=2.52.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[[tool.mypy.overrides]]
# asyncpg (AGT-041) ships no py.typed marker/stubs -- every other dependency here happens to have
# one, so this is the first package needing this override.
module = "asyncpg"
ignore_missing_imports = true
