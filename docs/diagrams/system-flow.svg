<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="690" rx="20" fill="#f7f8fb"></rect>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#0f9d8f"></polygon>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#8891a6"></polygon>
    </marker>
  </defs>

  <!-- Clients -->
  <text x="600" y="16" font-size="11" letter-spacing="1.2" text-anchor="middle" fill="#5b6478">CLIENTS</text>
  <g>
    <rect x="230" y="24" width="320" height="56" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="390" y="48" font-size="14" font-weight="700" text-anchor="middle" fill="#161c2b">React Frontend</text>
    <text x="390" y="65" font-size="9.5" text-anchor="middle" fill="#5b6478">Vercel · login, Direct / Agentic query, history, documents</text>
  </g>
  <g>
    <rect x="650" y="24" width="320" height="56" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="810" y="48" font-size="14" font-weight="700" text-anchor="middle" fill="#161c2b">API Callers</text>
    <text x="810" y="65" font-size="9.5" text-anchor="middle" fill="#5b6478">curl, scripts, other services</text>
  </g>

  <!-- Clients -> API bus -->
  <line x1="390" y1="80" x2="390" y2="103" stroke="#0f9d8f" stroke-width="2"></line>
  <line x1="810" y1="80" x2="810" y2="103" stroke="#0f9d8f" stroke-width="2"></line>
  <line x1="390" y1="103" x2="810" y2="103" stroke="#0f9d8f" stroke-width="2"></line>
  <line x1="525" y1="103" x2="525" y2="126" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <text x="539" y="119" font-size="11" fill="#5b6478">REST + SSE</text>

  <!-- Service container -->
  <rect x="150" y="130" width="750" height="315" rx="12" fill="#ffffff" stroke="#0f9d8f" stroke-width="1.75"></rect>
  <text x="172" y="150" font-size="11" letter-spacing="1.2" fill="#5b6478">FASTAPI — app/ (Cloud Run)</text>

  <!-- Row A: API -> session -> cache -->
  <g>
    <rect x="170" y="166" width="190" height="58" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="265" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">API routes</text>
    <text x="265" y="202" font-size="9.5" text-anchor="middle" fill="#5b6478">/query · /query/direct · /health</text>
    <text x="265" y="215" font-size="9.5" text-anchor="middle" fill="#5b6478">/documents · /history · /auth/login</text>
  </g>
  <g>
    <rect x="400" y="166" width="190" height="58" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="495" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Session check</text>
    <text x="495" y="202" font-size="9.5" text-anchor="middle" fill="#5b6478">Authorization + X-RAG-CSRF-Token</text>
    <text x="495" y="215" font-size="9.5" text-anchor="middle" fill="#5b6478">401 if missing, no fallback account</text>
  </g>
  <g>
    <rect x="630" y="166" width="250" height="58" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="755" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Query cache + history</text>
    <text x="755" y="202" font-size="9.5" text-anchor="middle" fill="#5b6478">24h TTL, keyed by user + mode + question</text>
    <text x="755" y="215" font-size="9.5" text-anchor="middle" fill="#5b6478">optional, needs DATABASE_URL</text>
  </g>
  <line x1="360" y1="195" x2="398" y2="195" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="590" y1="195" x2="628" y2="195" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="755" y1="224" x2="755" y2="248" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <text x="769" y="240" font-size="10" fill="#5b6478">cache miss</text>

  <!-- LangGraph box -->
  <rect x="170" y="250" width="710" height="108" rx="8" fill="#fafbfd" stroke="#d8dce6" stroke-width="1.25"></rect>
  <text x="188" y="268" font-size="10" letter-spacing="1.2" fill="#5b6478">LANGGRAPH STATE MACHINE</text>

  <g>
    <rect x="190" y="278" width="125" height="56" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="252" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Gatekeeper</text>
    <text x="252" y="319" font-size="9.5" text-anchor="middle" fill="#5b6478">grade · pick route</text>
  </g>
  <g>
    <rect x="370" y="278" width="125" height="56" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="432" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Research</text>
    <text x="432" y="319" font-size="9.5" text-anchor="middle" fill="#5b6478">KB (MCP) or web</text>
  </g>
  <g>
    <rect x="550" y="278" width="125" height="56" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="612" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Writer</text>
    <text x="612" y="319" font-size="9.5" text-anchor="middle" fill="#5b6478">cited draft</text>
  </g>
  <g>
    <rect x="730" y="278" width="125" height="56" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="792" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Verifier</text>
    <text x="792" y="319" font-size="9.5" text-anchor="middle" fill="#5b6478">vs. real evidence</text>
  </g>
  <line x1="315" y1="306" x2="368" y2="306" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="495" y1="306" x2="548" y2="306" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="675" y1="306" x2="728" y2="306" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- retry loop: Verifier -> Research -->
  <path d="M 792 278 C 792 258, 432 258, 432 276" stroke="#8891a6" stroke-width="1.5" fill="none" stroke-dasharray="3 4" marker-end="url(#arrow-muted)"></path>
  <rect x="538" y="253" width="148" height="15" fill="#fafbfd"></rect>
  <text x="612" y="264" font-size="9.5" text-anchor="middle" fill="#5b6478">ungrounded, retries left</text>
  <text x="868" y="350" font-size="9.5" text-anchor="end" fill="#5b6478">grounded: answer  ·  otherwise: refusal</text>

  <!-- Row C: shared core + MCP -->
  <rect x="170" y="384" width="330" height="44" rx="6" fill="#0f9d8f1a" stroke="#0f9d8f" stroke-width="1" stroke-dasharray="2 3"></rect>
  <text x="335" y="403" font-size="10.5" text-anchor="middle" fill="#5b6478">shared core — config · tracing · OTel metrics</text>
  <text x="335" y="418" font-size="10.5" text-anchor="middle" fill="#5b6478">CORS · untrusted-content sanitizer</text>

  <g>
    <rect x="540" y="384" width="230" height="44" rx="7" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="655" y="403" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">MCP server (subprocess)</text>
    <text x="655" y="419" font-size="9.5" text-anchor="middle" fill="#5b6478">search_knowledge_base</text>
  </g>
  <path d="M 450 334 L 450 360 L 655 360 L 655 382" stroke="#0f9d8f" stroke-width="2" fill="none" marker-end="url(#arrow)"></path>
  <text x="560" y="374" font-size="10" fill="#5b6478">stdio tool call</text>

  <!-- Container -> data bus -->
  <line x1="525" y1="445" x2="525" y2="470" stroke="#0f9d8f" stroke-width="2"></line>
  <text x="539" y="463" font-size="11" fill="#5b6478">calls out</text>
  <line x1="235" y1="470" x2="814" y2="470" stroke="#0f9d8f" stroke-width="2"></line>
  <line x1="235" y1="470" x2="235" y2="496" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="428" y1="470" x2="428" y2="496" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="621" y1="470" x2="621" y2="496" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>
  <line x1="814" y1="470" x2="814" y2="496" stroke="#0f9d8f" stroke-width="2" marker-end="url(#arrow)"></line>

  <!-- Data + external row -->
  <text x="525" y="490" font-size="11" letter-spacing="1.2" text-anchor="middle" fill="#5b6478">DATA &amp; EXTERNAL SERVICES</text>
  <g>
    <rect x="150" y="496" width="170" height="74" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="235" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#161c2b">enterprise-rag-platform</text>
    <text x="235" y="537" font-size="9.5" text-anchor="middle" fill="#5b6478">auth · retrieval · documents</text>
    <text x="235" y="551" font-size="9.5" text-anchor="middle" fill="#5b6478">always as the caller</text>
  </g>
  <g>
    <rect x="343" y="496" width="170" height="74" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="428" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#161c2b">Ollama / OpenRouter</text>
    <text x="428" y="537" font-size="9.5" text-anchor="middle" fill="#5b6478">LLM for Gatekeeper, Writer,</text>
    <text x="428" y="551" font-size="9.5" text-anchor="middle" fill="#5b6478">Verifier (PydanticAI)</text>
  </g>
  <g>
    <rect x="536" y="496" width="170" height="74" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="621" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#161c2b">Web search (ddgs)</text>
    <text x="621" y="537" font-size="9.5" text-anchor="middle" fill="#5b6478">web_fallback route only</text>
    <text x="621" y="551" font-size="9.5" text-anchor="middle" fill="#5b6478">results labeled "web"</text>
  </g>
  <g>
    <rect x="729" y="496" width="171" height="74" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="814" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#161c2b">Neon Postgres</text>
    <text x="814" y="537" font-size="9.5" text-anchor="middle" fill="#5b6478">query_history table</text>
    <text x="814" y="551" font-size="9.5" text-anchor="middle" fill="#5b6478">(cache + audit log)</text>
  </g>

  <!-- Observability sidecar -->
  <line x1="900" y1="200" x2="958" y2="200" stroke="#8891a6" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arrow-muted)"></line>
  <text x="906" y="191" font-size="10" fill="#5b6478">traces</text>
  <line x1="900" y1="290" x2="958" y2="290" stroke="#8891a6" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arrow-muted)"></line>
  <text x="906" y="281" font-size="10" fill="#5b6478">OTel</text>
  <g>
    <rect x="960" y="172" width="200" height="60" rx="10" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="1060" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Langfuse</text>
    <text x="1060" y="215" font-size="9.5" text-anchor="middle" fill="#5b6478">agent traces · eval scores</text>
  </g>
  <g>
    <rect x="960" y="256" width="200" height="76" rx="10" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="1060" y="284" font-size="13" font-weight="700" text-anchor="middle" fill="#161c2b">Grafana Cloud</text>
    <text x="1060" y="302" font-size="9.5" text-anchor="middle" fill="#5b6478">traces · metrics · logs</text>
    <text x="1060" y="316" font-size="9.5" text-anchor="middle" fill="#5b6478">health probe</text>
  </g>

  <!-- Legend -->
  <line x1="150" y1="592" x2="1050" y2="592" stroke="#d8dce6" stroke-width="1"></line>
  <text x="150" y="616" font-size="10" font-weight="700" letter-spacing="1" fill="#5b6478">LEGEND</text>
  <g>
    <line x1="150" y1="639" x2="182" y2="639" stroke="#0f9d8f" stroke-width="2.5"></line>
    <text x="192" y="643" font-size="11" fill="#161c2b">Request / data flow</text>
  </g>
  <g>
    <line x1="380" y1="639" x2="412" y2="639" stroke="#8891a6" stroke-width="2" stroke-dasharray="3 4"></line>
    <text x="422" y="643" font-size="11" fill="#161c2b">Retry loop, telemetry export</text>
  </g>
  <g>
    <rect x="150" y="664" width="20" height="14" rx="3" fill="#eef0f6" stroke="#d8dce6" stroke-width="1.25"></rect>
    <text x="182" y="675" font-size="11" fill="#161c2b">Component inside the service</text>
  </g>
  <g>
    <rect x="480" y="664" width="20" height="14" rx="3" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"></rect>
    <text x="512" y="675" font-size="11" fill="#161c2b">Data store / external service</text>
  </g>
  <g>
    <rect x="800" y="664" width="20" height="14" rx="3" fill="#0f9d8f1a" stroke="#0f9d8f" stroke-width="1" stroke-dasharray="2 3"></rect>
    <text x="832" y="675" font-size="11" fill="#161c2b">Shared core (cross-cutting infra)</text>
  </g>
</svg>
