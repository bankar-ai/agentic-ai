name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Required by app.core.config.Settings but never dereferenced by this suite -- all tests run
      # fully mocked, no live Ollama/enterprise-rag-platform/Langfuse needed (see README.md).
      RAG_PLATFORM_BASE_URL: http://localhost:8000
      RAG_PLATFORM_EMAIL: ci@example.com
      RAG_PLATFORM_PASSWORD: ci-test-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so gitleaks' CI scan below isn't limited to this push's diff

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Scan for secrets (gitleaks)
        run: uv run pre-commit run gitleaks --all-files

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Run tests (with coverage gate)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation -- no long-lived key involved
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Same command gcp-deployment-tracker.md documents for the manual fallback -- never
      # reinvented here, so the two stay in sync by construction.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy agentic-ai --source . --region us-central1 --allow-unauthenticated \
            --set-env-vars "RAG_PLATFORM_BASE_URL=https://34-31-5-88.sslip.io,RAG_PLATFORM_EMAIL=agentic-ai-service@example.com,LLM_PROVIDER=openrouter,OPENROUTER_MODEL=nvidia/nemotron-3-nano-30b-a3b:free,OPENROUTER_FALLBACK_MODEL=nvidia/nemotron-3.5-lightning:free,CORS_ALLOWED_ORIGINS=https://agentic-ai-psi-mauve.vercel.app,OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-prod-ap-south-1.grafana.net/otlp,OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf,OTEL_SERVICE_NAME=agentic-ai,OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.GRAFANA_OTLP_HEADERS }}" \
            --set-secrets "RAG_PLATFORM_PASSWORD=agentic-ai-rag-platform-password:latest,OPENROUTER_API_KEY=agentic-ai-openrouter-api-key:latest" \
            --memory 512Mi --cpu 1 --timeout 300 --concurrency 10 --min-instances 0 --max-instances 3 \
            --project self-hosted-rag-platform
