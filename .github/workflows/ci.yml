name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Required by app.core.config.Settings but never dereferenced by this suite -- all tests run
      # fully mocked, no live Ollama/enterprise-rag-platform/Langfuse needed (see README.md).
      RAG_PLATFORM_BASE_URL: http://localhost:8000
      RAG_PLATFORM_EMAIL: ci@example.com
      RAG_PLATFORM_PASSWORD: ci-test-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so gitleaks' CI scan below isn't limited to this push's diff

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Scan for secrets (gitleaks)
        run: uv run pre-commit run gitleaks --all-files

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Run tests (with coverage gate)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90
